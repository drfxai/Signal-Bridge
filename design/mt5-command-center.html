<style>
:root{

}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);min-height:100%;}
body{background:
 radial-gradient(circle at 74% -8%,rgba(63,116,198,.2),transparent 33%),
 radial-gradient(circle at 4% 18%,rgba(82,215,255,.08),transparent 27%),var(--bg);}
button,input,select{font:inherit}.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:rgba(8,14,24,.93);backdrop-filter:blur(18px);display:flex;flex-direction:column;gap:20px}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 14px}.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#153753,#0c1625);border:1px solid #4286a8;color:var(--cyan);font-weight:900;box-shadow:0 0 28px rgba(82,215,255,.1)}
.brand b{font-size:14px;letter-spacing:.2px}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:1.6px;text-transform:uppercase;margin-top:3px}
.nav-title{font-size:9px;color:#5f7591;letter-spacing:1.6px;text-transform:uppercase;padding:0 12px 5px}.nav{display:grid;gap:4px}.nav a{color:#91a3b8;text-decoration:none;padding:11px 12px;border-radius:10px;font-size:12px;font-weight:700;display:flex;gap:10px;align-items:center;border:1px solid transparent}.nav a.active{color:#dff8ff;background:linear-gradient(90deg,rgba(32,92,121,.45),rgba(19,34,56,.6));border-color:#285875}.ico{width:19px;text-align:center;font-size:15px}.side-foot{margin-top:auto}.account-chip{padding:12px;border:1px solid var(--line);background:var(--panel);border-radius:12px}.account-chip .row{display:flex;align-items:center;gap:8px;font-size:11px}.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(69,213,161,.08)}.account-chip small{display:block;margin-top:6px;color:var(--muted);font-size:10px;line-height:1.5}
.main{min-width:0;padding:20px 26px 34px}.top{height:52px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(34,50,76,.72);margin:0 -26px 22px;padding:0 26px}.crumb{font-size:11px;color:var(--muted)}.crumb b{color:var(--text)}.top-right{display:flex;gap:8px;align-items:center}.status-pill{font:700 9px ui-monospace,Consolas,monospace;letter-spacing:.8px;border-radius:999px;padding:7px 10px;border:1px solid #2d5b4e;color:#8ff0c9;background:#0f2c28}.status-pill.cyan{border-color:#2a5570;color:#9ceaff;background:#10283a}.status-pill.demo{border-color:#6b5330;color:#ffd18d;background:#302516}.avatar{width:34px;height:34px;border-radius:10px;border:1px solid var(--line2);display:grid;place-items:center;background:var(--panel2);font-size:10px;font-weight:800}
.page-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;margin-bottom:18px}.eyebrow{font:800 9px ui-monospace,Consolas,monospace;color:var(--cyan);letter-spacing:1.7px;text-transform:uppercase;margin-bottom:7px}.page-head h1{font-size:27px;letter-spacing:-.8px;margin:0}.page-head p{color:var(--muted);font-size:12px;margin:7px 0 0;line-height:1.6}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line2);background:var(--panel2);color:var(--text);padding:9px 12px;border-radius:9px;font-size:10px;font-weight:800}.btn.primary{background:linear-gradient(120deg,#4bc9ec,#737fff);color:#06101a;border:0}.btn.danger{color:#ffafb7;background:#33202a;border-color:#75404c}
.grid-metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:11px;margin-bottom:13px}.metric{background:linear-gradient(160deg,var(--panel2),#0d1727);border:1px solid var(--line);border-radius:13px;padding:14px;min-height:105px}.metric .lab{font-size:9px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);font-weight:800}.metric .val{font:800 25px ui-monospace,Consolas,monospace;margin-top:13px;letter-spacing:-1px}.metric .sub{font-size:9px;color:#7890aa;margin-top:4px}.green{color:var(--green)}.red{color:var(--red)}.cyan{color:var(--cyan)}.amber{color:var(--amber)}
.card{background:linear-gradient(160deg,var(--panel),#0d1625);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0}.card-h{display:flex;justify-content:space-between;align-items:center;padding:15px 16px 12px}.card-h b{font-size:12px}.card-h small{font-size:9px;color:var(--muted)}.card-body{padding:0 16px 16px}.split{display:grid;grid-template-columns:1.35fr .9fr;gap:13px;margin-bottom:13px}.split-eq{display:grid;grid-template-columns:1fr 1fr;gap:13px}.pipeline{display:grid;grid-template-columns:repeat(5,1fr);align-items:center;gap:7px;padding:9px 0 5px}.node{border:1px solid var(--line2);border-radius:11px;background:var(--panel2);padding:12px 8px;text-align:center;position:relative}.node .n{font-size:10px;font-weight:800}.node .s{font:700 8px ui-monospace,Consolas,monospace;color:var(--muted);margin-top:4px}.node:after{content:'›';position:absolute;right:-9px;top:22px;color:#617793;font-size:18px}.node:last-child:after{display:none}.node.live{border-color:#2d7967;box-shadow:0 0 0 1px rgba(69,213,161,.06) inset}.node.live .s{color:var(--green)}
.chart{height:162px;position:relative;margin-top:4px;border-radius:11px;background:linear-gradient(180deg,rgba(30,54,83,.28),rgba(10,17,29,.15));overflow:hidden;border:1px solid rgba(44,66,96,.55)}.chart svg{width:100%;height:100%;display:block}.chart .tag{position:absolute;right:11px;top:10px;font:700 8px ui-monospace,Consolas,monospace;color:var(--muted);letter-spacing:.5px}
.positions{display:grid;gap:8px}.pos{padding:11px 0;border-top:1px solid rgba(34,50,76,.7)}.pos:first-child{border-top:0;padding-top:2px}.pos-h{display:flex;justify-content:space-between;gap:10px}.sym{font-size:11px;font-weight:900}.side-tag{font:800 8px ui-monospace,Consolas,monospace;padding:2px 5px;border-radius:4px;margin-right:6px}.side-tag.buy{background:rgba(69,213,161,.12);color:var(--green)}.side-tag.sell{background:rgba(255,111,125,.12);color:var(--red)}.pnl{font:800 12px ui-monospace,Consolas,monospace}.meta{font:600 9px ui-monospace,Consolas,monospace;color:var(--muted);margin-top:4px}.rail{height:4px;background:#152338;border-radius:9px;margin-top:8px;position:relative;overflow:hidden}.rail span{position:absolute;height:100%;left:31%;width:43%;background:linear-gradient(90deg,var(--amber),var(--green));border-radius:9px}.rail i{position:absolute;left:74%;top:-2px;width:2px;height:8px;background:#fff}.ends{display:flex;justify-content:space-between;font:700 8px ui-monospace,Consolas,monospace;color:#697f98;margin-top:4px}
.events{display:grid;gap:7px}.event{display:grid;grid-template-columns:72px 1fr 65px;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#101b2d;font-size:9px;align-items:center}.event time{font-family:ui-monospace,Consolas,monospace;color:#7188a1}.event .st{text-align:right;font:800 8px ui-monospace,Consolas,monospace;color:var(--green)}.event.warn .st{color:var(--amber)}
.section-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:13px}.setting-card{padding:16px}.setting-card h3{font-size:12px;margin:0 0 4px}.setting-card>p{font-size:9.5px;color:var(--muted);line-height:1.5;margin:0 0 14px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{min-width:0}.field label{display:block;font:700 8px ui-monospace,Consolas,monospace;color:#8094ac;margin:0 0 5px;text-transform:uppercase;letter-spacing:.55px}.input{height:38px;border:1px solid var(--line2);background:#0c1524;border-radius:9px;padding:0 10px;display:flex;align-items:center;justify-content:space-between;font:700 10px ui-monospace,Consolas,monospace;color:#dce9f7;overflow:hidden}.input span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tag-ok{color:var(--green);font-size:9px}.toggle-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid rgba(34,50,76,.65)}.toggle-row:first-of-type{border-top:0}.toggle-row b{font-size:10px}.toggle-row small{display:block;font-size:8.5px;color:var(--muted);margin-top:3px}.switch{width:38px;height:21px;border-radius:999px;background:#1b2a40;border:1px solid var(--line2);position:relative}.switch:after{content:'';position:absolute;width:15px;height:15px;border-radius:50%;top:2px;left:2px;background:#8fa4bd}.switch.on{background:#24745f}.switch.on:after{left:19px;background:#d9fff0}.kv{display:grid;grid-template-columns:1fr 1fr;gap:9px}.kv>div{border:1px solid var(--line);border-radius:9px;background:#0d1728;padding:10px}.kv .k{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}.kv .v{font:800 10px ui-monospace,Consolas,monospace;margin-top:4px}.warnbox{padding:10px;border:1px solid #69512c;background:#271f14;border-radius:9px;color:#e7c583;font-size:9px;line-height:1.5;margin-top:10px}
.telegram-layout{display:grid;grid-template-columns:.9fr 1.1fr;gap:13px}.source{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-top:7px;background:#0f1a2c}.source b{font-size:10px}.source small{display:block;color:var(--muted);font-size:8px;margin-top:3px}.source .state{font:800 8px ui-monospace,Consolas,monospace;color:var(--green)}.msg{border:1px solid var(--line);border-radius:12px;padding:12px;background:#0e192a}.msg .from{font-size:9px;color:#8cb4d5}.bubble{margin-top:8px;padding:11px 12px;background:#14243a;border-radius:8px 12px 12px 12px;font:700 10px ui-monospace,Consolas,monospace;line-height:1.65}.parse{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.parse div{border:1px solid var(--line);background:#0b1524;border-radius:8px;padding:8px}.parse .k{font-size:7.5px;color:var(--muted);text-transform:uppercase}.parse .v{font:800 9px ui-monospace,Consolas,monospace;margin-top:3px}.decision{margin-top:10px;border:1px solid #2e6557;background:#102c28;border-radius:9px;padding:9px 10px;display:flex;justify-content:space-between;font-size:9px}.decision b{color:var(--green)}
.chart-shell{position:relative;height:700px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#0a101b}.candles{position:absolute;inset:0}.overlay-panel{position:absolute;top:22px;left:22px;width:410px;border:1px solid #2a405d;border-radius:14px;background:rgba(10,17,29,.94);backdrop-filter:blur(14px);box-shadow:var(--shadow);overflow:hidden}.op-head{padding:13px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.op-head b{font-size:11px}.op-status{font:800 8px ui-monospace,Consolas,monospace;color:var(--green)}.op-body{padding:12px 14px}.op-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.op-stat{background:#101b2d;border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center}.op-stat .k{font-size:7px;color:var(--muted);text-transform:uppercase}.op-stat .v{font:800 10px ui-monospace,Consolas,monospace;margin-top:3px}.mini-row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid rgba(34,50,76,.7);font-size:9px}.mini-row:first-of-type{margin-top:10px}.mini-row .v{font-family:ui-monospace,Consolas,monospace}.op-events{margin-top:9px;border-top:1px solid var(--line);padding-top:8px;font:700 8.5px ui-monospace,Consolas,monospace;color:#9fb2c8;line-height:1.7}
.badge-proto{display:inline-flex;padding:4px 7px;border-radius:6px;border:1px solid #5c4830;background:#2b2217;color:#e4bd79;font:800 8px ui-monospace,Consolas,monospace;letter-spacing:.6px;text-transform:uppercase}
@media(max-width:900px){.shell{grid-template-columns:1fr}.side{display:none}.main{padding:16px}.top{margin:0 -16px 18px;padding:0 16px}.grid-metrics{grid-template-columns:repeat(2,1fr)}.split,.split-eq,.section-grid,.telegram-layout{grid-template-columns:1fr}.pipeline{grid-template-columns:1fr}.node:after{content:'↓';right:50%;top:auto;bottom:-15px}.form-grid{grid-template-columns:1fr}}
</style>

<body>
<div class="shell">

</div>
<script>
const view=new URLSearchParams(location.search).get('view')||'dashboard';
document.querySelectorAll('.nav a[data-view]').forEach(a=>a.classList.toggle('active',a.dataset.view===view));
const root=document.getElementById('view');const crumb=document.getElementById('crumb');
function head(k,t,s,acts=''){return `<div class="page-head"><div><div class="eyebrow">${k}</div><h1>${t}</h1><p>${s}</p></div><div class="actions">${acts}</div></div>`}
function dashboard(){crumb.textContent='Live Dashboard';return head('REALTIME EXECUTION','MT5 Live Command Center','Live account state, signal routing, risk exposure and broker execution in one workspace.','<button class="btn">Dry run</button><button class="btn primary">New route</button>')+`
<div class="grid-metrics">
 <div class="metric"><div class="lab">Balance</div><div class="val">$12,480</div><div class="sub">Broker-reported</div></div>
 <div class="metric"><div class="lab">Equity</div><div class="val">$12,617</div><div class="sub green">+$137 floating</div></div>
 <div class="metric"><div class="lab">Risk in market</div><div class="val amber">1.72%</div><div class="sub">3 active positions</div></div>
 <div class="metric"><div class="lab">Today P/L</div><div class="val green">+$286</div><div class="sub">+2.29% · 7 closed</div></div>
 <div class="metric"><div class="lab">Execution latency</div><div class="val cyan">84ms</div><div class="sub">p50 agent round-trip</div></div>
</div>
<div class="card" style="margin-bottom:13px"><div class="card-h"><b>Live signal path</b><small>Event-driven · no terminal polling</small></div><div class="card-body"><div class="pipeline">
 <div class="node live"><div class="n">TradingView</div><div class="s">WEBHOOK OK</div></div><div class="node live"><div class="n">Cloudflare</div><div class="s">VALIDATED 22ms</div></div><div class="node live"><div class="n">Agent Hub</div><div class="s">WS CONNECTED</div></div><div class="node live"><div class="n">MT5 Agent</div><div class="s">ACCOUNT VERIFIED</div></div><div class="node live"><div class="n">Broker</div><div class="s">PEPPERSTONE LIVE</div></div>
</div></div></div>
<div class="split">
 <section class="card"><div class="card-h"><b>Equity & execution pulse</b><small>Last 3 hours</small></div><div class="card-body"><div class="chart"><span class="tag">LIVE ACCOUNT</span><svg viewBox="0 0 700 180" preserveAspectRatio="none"><g stroke="#1c2d46" stroke-width="1"><path d="M0 35H700M0 75H700M0 115H700M0 155H700"/><path d="M90 0V180M190 0V180M290 0V180M390 0V180M490 0V180M590 0V180"/></g><path d="M0 134 C60 126 75 141 125 121 S205 98 247 111 S322 77 356 86 S430 60 470 72 S546 43 587 56 S650 31 700 39" fill="none" stroke="#52d7ff" stroke-width="3"/><path d="M0 134 C60 126 75 141 125 121 S205 98 247 111 S322 77 356 86 S430 60 470 72 S546 43 587 56 S650 31 700 39 L700 180 L0 180Z" fill="url(#g)" opacity=".18"/><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#52d7ff"/><stop offset="1" stop-color="#52d7ff" stop-opacity="0"/></linearGradient></defs></svg></div></div></section>
 <section class="card"><div class="card-h"><b>Open positions</b><small>Broker truth</small></div><div class="card-body"><div class="positions">
  <div class="pos"><div class="pos-h"><div class="sym"><span class="side-tag buy">BUY</span>XAUUSD</div><div class="pnl green">+$92.40</div></div><div class="meta">0.08 lots · 2748.61 → 2761.84 · +1.26R</div><div class="rail"><span></span><i></i></div><div class="ends"><span>SL 2737.20</span><span>TP3 2775.00</span></div></div>
  <div class="pos"><div class="pos-h"><div class="sym"><span class="side-tag sell">SELL</span>EURUSD</div><div class="pnl green">+$51.18</div></div><div class="meta">0.21 lots · 1.16482 → 1.16231 · +0.74R</div><div class="rail"><span style="left:38%;width:28%"></span><i style="left:66%"></i></div><div class="ends"><span>SL 1.16810</span><span>TP3 1.15840</span></div></div>
  <div class="pos"><div class="pos-h"><div class="sym"><span class="side-tag buy">BUY</span>US30</div><div class="pnl red">-$6.27</div></div><div class="meta">0.03 lots · 48124.2 → 48103.3 · -0.08R</div><div class="rail"><span style="left:28%;width:7%;background:var(--red)"></span><i style="left:28%"></i></div><div class="ends"><span>SL 47890</span><span>TP3 48610</span></div></div>
 </div></div></section>
</div>
<div class="split-eq"><section class="card"><div class="card-h"><b>Live event stream</b><small>Immutable execution trace</small></div><div class="card-body"><div class="events">
 <div class="event"><time>12:42:18</time><span>XAUUSD BUY · risk approved 0.80% · 0.08 lots</span><span class="st">FILLED</span></div>
 <div class="event"><time>12:42:17</time><span>Broker retcode 10009 · ticket #94182731</span><span class="st">VERIFIED</span></div>
 <div class="event"><time>12:40:03</time><span>Telegram message parsed · EURUSD SELL · confidence deterministic</span><span class="st">ROUTED</span></div>
 <div class="event warn"><time>12:37:46</time><span>US30 spread 41 pts · under 60 pt limit</span><span class="st">CHECKED</span></div>
 </div></div></section>
 <section class="card"><div class="card-h"><b>Safety core</b><small>EA-side hard limits</small></div><div class="card-body"><div class="kv"><div><div class="k">Max risk / trade</div><div class="v">1.00%</div></div><div><div class="k">Max open trades</div><div class="v">4</div></div><div><div class="k">Daily loss gate</div><div class="v green">-3.0%</div></div><div><div class="k">Account mode</div><div class="v green">HEDGING</div></div></div><div class="warnbox">Broker-side SL is mandatory. Unknown execution state blocks blind retry and starts reconciliation.</div></div></section></div>`}
function settings(){crumb.textContent='MT5 Settings';return head('TERMINAL CONFIGURATION','MT5 Connection & Risk Settings','A professional control surface based on the proven DrFXQuant EA model, upgraded for SignalBridge realtime transport.','<button class="btn">Export config</button><button class="btn primary">Save & validate</button>')+`
<div class="section-grid">
 <section class="card setting-card"><h3>Connection & account binding</h3><p>Keys are scoped to this Agent. Account identity is verified before any command can execute.</p><div class="form-grid">
  <div class="field"><label>Cloud endpoint</label><div class="input"><span>wss://agent.signalbridge.workers.dev</span><span class="tag-ok">LIVE</span></div></div>
  <div class="field"><label>Agent key</label><div class="input"><span>sb_ag_7f3a•••••••••81cd</span><span>SHOW</span></div></div>
  <div class="field"><label>Broker</label><div class="input"><span>Pepperstone Group Ltd</span></div></div>
  <div class="field"><label>Server</label><div class="input"><span>Pepperstone-MT5-Live02</span></div></div>
  <div class="field"><label>Account</label><div class="input"><span>#78425139 · LIVE</span><span class="tag-ok">BOUND</span></div></div>
  <div class="field"><label>Margin mode</label><div class="input"><span>Retail hedging</span><span class="tag-ok">RECOMMENDED</span></div></div>
 </div><div class="warnbox">A second EA instance on the same account is refused. A Live slot and Demo slot are bound independently, following the DrFXQuant protection model.</div></section>
 <section class="card setting-card"><h3>Execution controls</h3><p>Risk is recomputed locally from the broker contract specification before sending an order.</p>
  <div class="toggle-row"><div><b>Enable automated trading</b><small>Off = dry-run logs only</small></div><div class="switch on"></div></div>
  <div class="toggle-row"><div><b>Attach broker-side final TP</b><small>TP3 remains active if Agent disconnects</small></div><div class="switch on"></div></div>
  <div class="toggle-row"><div><b>TP2 partial + break-even</b><small>Bank half remaining volume and move SL to cost</small></div><div class="switch on"></div></div>
  <div class="toggle-row"><div><b>Minimum-lot fallback</b><small>Allowed only under configured risk ceiling</small></div><div class="switch on"></div></div>
 </section>
</div>

   <div class="source"><div><b>Gold Pro Signals</b><small>@goldpro · entries enabled</small></div><span class="state">● LIVE</span></div>
   <div class="source"><div><b>DrFX Private Room</b><small>-1002184… · manual approval</small></div><span class="state">● LIVE</span></div>

  </section>
