name = "drfx-signalbridge-ingress"
main = "worker/src/index.mjs"
compatibility_date = "2026-10-27"
workers_dev = false

# Create a new D1 database for this project, then replace database_id.
# Do not commit secrets; token hashes live in D1 and private tokens remain with the owner.
[[d1_databases]]
binding = "DB"
database_name = "signalbridge-ingress"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "worker/migrations"
