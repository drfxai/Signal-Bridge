name = "drfx-signalbridge-ingress"
main = "worker/src/index.mjs"
compatibility_date = "2026-10-27"
workers_dev = false

[vars]
DEPLOYMENT_TIER = "free"

[[d1_databases]]
binding = "DB"
database_name = "signalbridge-ingress"
database_id = "9439ff03-b1ec-47e6-b2b6-b8f2e7d33559"
migrations_dir = "worker/migrations"

[[durable_objects.bindings]]
name = "AGENT_HUB"
class_name = "AgentHub"

[exports.AgentHub]
type = "durable-object"
storage = "sqlite"

# Production custom domain:
# https://signalbridge.drfx.online
#
# Free launch: no Queues on the critical path.
# Agent transport uses a hibernatable Durable Object WebSocket.
