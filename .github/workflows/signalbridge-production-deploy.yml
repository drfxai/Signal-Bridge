name: SignalBridge production deployment (Cloudflare Wrangler)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/signalbridge-production-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: signalbridge-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 1727196aa64f219aed8e56ea31720547
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify protected deploy credentials are configured
        shell: bash
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not configured as a GitHub Actions repository secret. Never commit an API token to source."
            exit 1
          fi
      - name: Test production source
        run: npm run check
      - name: Install pinned Wrangler and verify bundled Workers
        run: |
          npm install --no-save --package-lock=false wrangler@4
          npx wrangler deploy --dry-run -c wrangler.toml --outdir /tmp/bridge-deploy-ingress
          npx wrangler deploy --dry-run -c site/wrangler.jsonc --outdir /tmp/bridge-deploy-site
      - name: Publish ingress Worker
        run: npx wrangler deploy -c wrangler.toml --keep-vars
      - name: Publish site and Telegram bot preserving secrets and public assets
        run: npx wrangler deploy -c site/wrangler.jsonc --keep-vars
