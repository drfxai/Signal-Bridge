name: Verify live five-language Signal Bridge release
on:
  push:
    branches:
      - ops/telegram-menu-deploy-20261112
    paths:
      - .github/workflows/verify-live-locale.yml
permissions:
  contents: read
jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check public website, Telegram Mini App, i18n and retained assets
        shell: bash
        run: |
          set -euo pipefail
          root="https://drfx.company"
          stamp="release-smoke-20261112-22"
          curl --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 45 --compressed -fsS -D /tmp/site-headers -o /tmp/index.html "$root/?$stamp"
          grep -qi 'x-drfx-ui-release: 20261112-five-languages-22.0' /tmp/site-headers
          grep -q 'data-site-language="hi"' /tmp/index.html
          grep -q 'dfx-locale-tag">HI' /tmp/index.html
          grep -q 'हिन्दी' /tmp/index.html
          echo "PASS: website now serves 22.0, including Hindi picker."
          curl --retry 3 --retry-delay 2 -fsS -o /tmp/i18n.js "$root/assets/i18n.js?v=20261112-five-languages-22.0"
          grep -q 'DrFXI18N' /tmp/i18n.js
          grep -q 'एडमिन नियंत्रण केंद्र' /tmp/i18n.js
          grep -q 'Центр администрирования' /tmp/i18n.js
          grep -q 'Yönetim Merkezi' /tmp/i18n.js
          echo "PASS: latest translation dictionary includes administrative copy."
          curl --retry 3 --retry-delay 2 -fsS -o /tmp/telegram.html "$root/telegram?$stamp"
          grep -q 'data-mini-lang="hi"' /tmp/telegram.html
          grep -q 'miniLangPicker' /tmp/telegram.html
          grep -q 'miniClientPortalAction' /tmp/telegram.html
          echo "PASS: live Telegram WebApp has five-language navigation and client portal."
          curl --retry 3 --retry-delay 2 -fsS -o /tmp/config.json "$root/api/config?$stamp"
          grep -q '"ok":true' /tmp/config.json
          echo "PASS: backend health endpoint responds."
          curl --retry 2 --retry-delay 2 -fsS -o /tmp/telegram-health.json "$root/api/telegram/health?$stamp"
          jq -c '{ok,configured,bot_token_valid,webhook_matches,widget_queries_registered,mini_app_menu_configured,widget_commands_registered,webhook_pending_updates}' /tmp/telegram-health.json
          jq -e '.ok == true and .configured == true and .bot_token_valid == true and .webhook_matches == true and .widget_queries_registered == true and .mini_app_menu_configured == true and .native_commands_hidden == true' /tmp/telegram-health.json >/dev/null
          echo "PASS: Telegram bot, widget queries and Mini App menu are configured."

          curl --retry 3 --retry-delay 2 -fsS -o /tmp/hero.webp "$root/media/scalper/hero.webp"
          test "$(wc -c </tmp/hero.webp)" -gt 10000
          echo "PASS: static images are retained."
