name: Site static assets manifest audit
on:
  push:
    branches: [main]
    paths:
      - site/public/**
      - .github/workflows/site-assets-manifest.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Print reproducible Cloudflare asset manifest (no secrets)
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          const base='site/public', manifest={};
          function scan(dir){
            for (const item of fs.readdirSync(dir,{withFileTypes:true})){
              const f=path.join(dir,item.name);
              if(item.isDirectory())scan(f);
              else if(item.isFile()){
                const rel=f.slice(base.length+1).replace(/\\/g,'/');
                const buf=fs.readFileSync(f);
                const ext=path.extname(rel).slice(1);
                const hash=crypto.createHash('sha256').update(buf.toString('base64')+ext).digest('hex').slice(0,32);
                manifest['/'+rel]={hash,size:buf.length};
              }
            }
          }
          scan(base);
          console.log('CLOUDFLARE_MANIFEST_START');
          console.log(JSON.stringify(manifest));
          console.log('CLOUDFLARE_MANIFEST_END');
          JS
      - name: Export one public missing asset for direct Cloudflare upload
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const encoded=fs.readFileSync('site/public/media/signal-bridge/premium-card.jpg').toString('base64');
          console.log('CF_ASSET_EXPORT_START');
          for(let i=0;i<encoded.length;i+=4000)console.log('CF_ASSET_CHUNK:'+encoded.slice(i,i+4000));
          console.log('CF_ASSET_EXPORT_END');
          JS
