name: Build verified Signal Bridge locale release bundle
on:
  push:
    branches:
      - ops/telegram-menu-deploy-20261112
    paths:
      - .github/workflows/build-site-locale.yml
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact source release and compile Worker offline
        run: |
          git merge-base --is-ancestor "884f4839ee16e7b300bfb489d4d516d6f26a8052" HEAD
          git diff --quiet "884f4839ee16e7b300bfb489d4d516d6f26a8052" HEAD -- site/src site/public
          npm install --no-save --package-lock=false wrangler@4
          npx wrangler deploy --dry-run --config site/wrangler.jsonc --outdir /tmp/drfx-locale-release
          node --check /tmp/drfx-locale-release/worker.js
      - name: Export exact deployable content without production access
        run: |
          mkdir -p .ci-build
          cp /tmp/drfx-locale-release/worker.js .ci-build/worker.js
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';
          import {readFileSync,writeFileSync} from 'node:fs';
          const data=readFileSync('.ci-build/worker.js');
          const manifest={
            sourceCommit:'884f4839ee16e7b300bfb489d4d516d6f26a8052',
            sha256:createHash('sha256').update(data).digest('hex'),
            bytes:data.length,
            worker:'drfx-company-site',
            release:'20261112-five-languages-22.0',
            mode:'code-only-content-update',
          };
          if(data.length<200000)throw new Error('Unexpectedly small bundle');
          writeFileSync('.ci-build/manifest.json',JSON.stringify(manifest,null,2)+'\n');
          NODE
          node --input-type=module <<'NODE'
          import {gzipSync} from 'node:zlib';
          import {createHash} from 'node:crypto';
          import {readFileSync,writeFileSync,mkdirSync,rmSync} from 'node:fs';
          const src=readFileSync('.ci-build/worker.js');
          const zipped=gzipSync(src,{level:9});
          const encoded=zipped.toString('base64');
          const width=190000,parts=[];
          rmSync('.ci-build/chunks',{recursive:true,force:true});
          mkdirSync('.ci-build/chunks',{recursive:true});
          for(let i=0;i<encoded.length;i+=width){
            const name=String(parts.length).padStart(3,'0')+'.b64';
            writeFileSync('.ci-build/chunks/'+name,encoded.slice(i,i+width));
            parts.push(name);
          }
          writeFileSync('.ci-build/gzip-manifest.json',JSON.stringify({
            sourceSha256:createHash('sha256').update(src).digest('hex'),
            gzipSha256:createHash('sha256').update(zipped).digest('hex'),
            sourceBytes:src.length,
            gzipBytes:zipped.length,
            base64Length:encoded.length,
            parts,
          },null,2)+'\n');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .ci-build/worker.js .ci-build/manifest.json .ci-build/gzip-manifest.json .ci-build/chunks/
          git commit -m "ops: stage verified release bundle from main 884f483"
          git push origin HEAD:refs/heads/ops/telegram-menu-deploy-20261112
