name: SignalBridge UI Quality Checks
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'design/**'
      - 'mt5/**'
      - 'worker/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'wrangler.toml'
      - '.github/workflows/ui-checks.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'design/**'
      - 'mt5/**'
      - 'worker/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'wrangler.toml'
      - '.github/workflows/ui-checks.yml'
permissions:
  contents: read
jobs:
  static-and-unit-tests:
    name: JavaScript syntax + parser + ingestion + agent contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run checks
        run: npm run check
  browser-controls:
    name: Mobile tablet desktop portal controls and screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser verification tools
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1 wrangler
          npx playwright install --with-deps chromium
      - name: Verify confirmation flow and responsive controls
        run: |
          npx wrangler deploy --dry-run --config site/wrangler.jsonc --outdir /tmp/signalbridge-built
          SB_WORKER_BUNDLE=file:///tmp/signalbridge-built/worker.js node scripts/verify-portal-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-responsive-ui-previews
          path: artifacts/ui-verification/
          if-no-files-found: warn
