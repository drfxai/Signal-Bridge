name: SignalBridge one-time verified release bundle export
on:
  push:
    paths:
      - '.github/workflows/signalbridge-export-bundles.yml'
permissions:
  contents: read
jobs:
  export-bundles:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact production bundles without credentials or deployment
        run: |
          npm install --no-save --package-lock=false wrangler@4
          mkdir -p /tmp/sb-export/site /tmp/sb-export/ingress
          npx wrangler deploy --dry-run --config site/wrangler.jsonc --outdir /tmp/sb-export/site
          npx wrangler deploy --dry-run --config wrangler.toml --outdir /tmp/sb-export/ingress
          test -s /tmp/sb-export/site/worker.js
          test -s /tmp/sb-export/ingress/index.js || test -s /tmp/sb-export/ingress/worker.js
      - name: Produce transport output of repository-public code only
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import zlib from 'node:zlib';
          function exportBundle(label, file) {
            const raw = fs.readFileSync(file);
            const data = zlib.gzipSync(raw, {level:9}).toString('base64');
            const sha = crypto.createHash('sha256').update(raw).digest('hex');
            console.log('SBX_BEGIN ' + label + ' ' + raw.length + ' ' + sha);
            const parts = data.match(/.{1,3500}/g) || [];
            parts.forEach((part,i)=>console.log('SBX_DATA ' + label + ' ' + i + ' ' + part));
            console.log('SBX_END ' + label + ' ' + parts.length);
          }
          exportBundle('SITE', '/tmp/sb-export/site/worker.js');
          const ingress = ['/tmp/sb-export/ingress/index.js','/tmp/sb-export/ingress/worker.js'].find(fs.existsSync);
          if (!ingress) throw new Error('Ingress bundle not found');
          exportBundle('INGRESS', ingress);
          const root='site/public', entries={};
          function visit(dir) {
            for (const ent of fs.readdirSync(dir,{withFileTypes:true})) {
              const full=path.join(dir,ent.name);
              if(ent.isDirectory()) visit(full);
              else if(ent.isFile()) {
                const bytes=fs.readFileSync(full);
                const url='/'+path.relative(root,full).split(path.sep).join('/');
                entries[url]={hash:crypto.createHash('sha256').update(bytes).digest('hex').slice(0,32),size:bytes.length};
              }
            }
          }
          visit(root);
          console.log('SBX_MANIFEST ' + Buffer.from(JSON.stringify(entries)).toString('base64'));
          console.log('SBX_COMMIT ' + process.env.GITHUB_SHA);
          EOF
