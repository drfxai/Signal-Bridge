name: Compile SignalBridge production EA 0.30.15
on:
  push:
    branches: ['build/ea-0-30-15-private-source']
  pull_request:
    types: [opened, synchronize]
    paths: ['.github/workflows/compile-ea-0315.yml']
permissions:
  contents: read
  id-token: write
jobs:
  compile-ex5:
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'build/ea-0-30-15-private-source')
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Prepare the verified source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $jwt=(Invoke-RestMethod -Uri ($env:ACTIONS_ID_TOKEN_REQUEST_URL+'&audience=drfx-ea-build-0315') -Headers @{Authorization=('Bearer '+$env:ACTIONS_ID_TOKEN_REQUEST_TOKEN)}).value
          Write-Output "::add-mask::$jwt"
          $source=Join-Path $env:RUNNER_TEMP 'drfx-ea-source.zip'
          try {
            Invoke-WebRequest -Uri 'https://sb-ea-0315-compile.drfxai.workers.dev/source' -Headers @{Authorization=('Bearer '+$jwt)} -OutFile $source
          } catch {
            $segment=$jwt.Split('.')[1].Replace('-','+').Replace('_','/')
            $segment=$segment.PadRight($segment.Length + ((4 - ($segment.Length % 4)) % 4), '=')
            $claims=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($segment)) | ConvertFrom-Json
            $claims | Select-Object aud,iss,repository,repository_id,runner_environment,sub,ref,head_ref,base_ref,event_name,workflow_ref,workflow_sha,exp,nbf | ConvertTo-Json -Compress | Out-Host
            throw
          }
          $actual=(Get-FileHash $source -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne 'adf0613275e6b7dd4498bd5188738ac6f194d88aaa8ba5f17f8e0d91669c8785'){throw 'Unexpected source digest'}
          Expand-Archive -Path $source -DestinationPath (Join-Path $env:RUNNER_TEMP 'private-sb-source')
          Remove-Item -LiteralPath $source
      - name: Install official MetaTrader 5 / MetaEditor
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $installer=Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          Invoke-WebRequest -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' -OutFile $installer
          $auth=Get-AuthenticodeSignature $installer
          if($auth.Status -ne 'Valid'){throw "Installer signature invalid: $($auth.Status)"}
          $target=Join-Path $env:RUNNER_TEMP 'meta-trader-5-ci'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          $p=Start-Process -FilePath $installer -ArgumentList @('/auto',('/path:"'+$target+'"')) -Wait -PassThru
          Write-Host "Installer exit: $($p.ExitCode)"
          $meta=$null
          for($i=0;$i -lt 75;$i++){
            $meta=Get-ChildItem -Path $target -Recurse -Filter 'metaeditor64.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if($meta){break}
            Start-Sleep -Seconds 3
          }
          if(-not $meta){throw "MetaEditor was not installed"}
          "METAEDITOR_PATH=$($meta.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Compile v0.30.15 EA and validate EX5
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $meta=$env:METAEDITOR_PATH
          $root=Split-Path $meta -Parent
          $target=Join-Path $env:RUNNER_TEMP 'DrFX_SignalBridge_EA.mq5'
          Copy-Item (Join-Path $env:RUNNER_TEMP 'private-sb-source/DrFX_SignalBridge_EA.mq5') $target
          Copy-Item (Join-Path $env:RUNNER_TEMP 'private-sb-source/DealHistory.mqh') (Join-Path $env:RUNNER_TEMP 'DealHistory.mqh')
          $terminalPath=Join-Path $root 'terminal64.exe'
          if(Test-Path $terminalPath){
            $terminal=Start-Process -FilePath $terminalPath -ArgumentList '/portable' -PassThru
            Start-Sleep -Seconds 8
            if(-not $terminal.HasExited){Stop-Process -Id $terminal.Id -Force -ErrorAction SilentlyContinue}
          }
          $bases=@($root,(Join-Path $env:APPDATA 'MetaQuotes\Terminal'),(Join-Path $env:LOCALAPPDATA 'MetaQuotes'))
          $standard=$null
          foreach($base in $bases){
            if(-not (Test-Path $base)){continue}
            $standard=Get-ChildItem -Path $base -Filter Trade.mqh -File -Recurse -ErrorAction SilentlyContinue | Where-Object {$_.FullName.EndsWith('\Include\Trade\Trade.mqh',[StringComparison]::OrdinalIgnoreCase)} | Select-Object -First 1
            if($standard){break}
          }
          if(-not $standard){throw 'Official MQL5 Standard Library Trade.mqh not found in installation or data folders'}
          $includeDir=Split-Path (Split-Path (Split-Path $standard.FullName -Parent) -Parent) -Parent
          Write-Host "Compiling with standard include root: $includeDir"
          $p=Start-Process -FilePath $meta -ArgumentList @(('/compile:"'+$target+'"'),('/include:"'+$includeDir+'"'),'/log') -PassThru -Wait
          $log=[System.IO.Path]::ChangeExtension($target,'.log')
          if(-not (Test-Path $log)){throw 'MetaEditor compile log missing'}
          $compileLog=Get-Content $log -Raw
          ($compileLog -split "`n" | Select-String -Pattern "(?i)result:|error [1-9]") | Out-Host
          if($compileLog -notmatch '\b0 errors,'){throw 'MetaEditor did not confirm zero compilation errors'}
          $compiled=[System.IO.Path]::ChangeExtension($target,'.ex5')
          if(-not (Test-Path $compiled)){throw "No EX5 generated (MetaEditor exit: $($p.ExitCode))"}
          $info=Get-Item $compiled
          if($info.Length -lt 4096){throw "EX5 unexpectedly small"}
          New-Item -ItemType Directory 'dist' -Force | Out-Null
          Copy-Item $compiled 'dist/DrFX_SignalBridge_EA_v0.30.15.ex5'
          $hash=(Get-FileHash $compiled -Algorithm SHA256).Hash
          @("SignalBridge EA v0.30.15 - RECEIPT RETRY FIX","SHA256: $hash","Size: $($info.Length) bytes","License validation requires configured backend.") | Set-Content 'dist/README.txt'
          Write-Host "Binary built: $($info.Length) bytes; SHA256 $hash"
      - name: Upload actual EX5 for download
        uses: actions/upload-artifact@v4
        with:
          name: DrFX_SignalBridge_EA_v0.30.15_SETUP_EX5
          path: dist/
          if-no-files-found: error
          retention-days: 1
